<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matematika sarguzashti</title>
  <style>
    :root {
      --ink: #0f172a;
      --blue: #2563eb;
      --pale: #eff6ff;
      --green: #15803d;
      --red: #b91c1c;
      --muted: #475569;
      --card: #f8fafc;
      --track: #e2e8f0;
      --shadow: rgba(30, 58, 138, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }

    .game {
      width: min(100%, 700px);
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 0 18px 50px var(--shadow);
      padding: 28px;
    }

    .title {
      margin: 0;
      text-align: center;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
    }

    .subtitle {
      margin: 10px 0 22px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      background: var(--pale);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.96rem;
    }

    .progress-track {
      height: 14px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .question-box {
      min-height: 220px;
      background: var(--card);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
    }

    .question-number {
      color: #64748b;
      font-weight: 700;
      margin-bottom: 16px;
    }

    #question {
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      margin: 0 0 18px;
      line-height: 1.4;
    }

    form {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 280px;
      max-width: 350px;
      padding: 14px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 1.08rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    button {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    button:hover {
      filter: brightness(0.96);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #feedback {
      min-height: 28px;
      margin-top: 16px;
      font-weight: 700;
      font-size: 1rem;
    }

    .good { color: var(--green); }
    .bad { color: var(--red); }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .secondary {
      background: #475569;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 520px) {
      .game { padding: 18px 16px; }
      form { flex-direction: column; }
      input, button { width: 100%; max-width: 100%; }
      .stats { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1 class="title">🧠 Matematika sarguzashti</h1>
    <p class="subtitle">1-sinfdan 5-sinfgacha, 100 bosqichli matematika o‘yi</p>

    <div class="stats">
      <span class="badge" id="levelLabel">Bosqich 1 / 100</span>
      <span class="badge" id="gradeLabel">1-sinf</span>
      <span class="badge" id="scoreLabel">Ball: 0</span>
    </div>

    <div class="progress-track" aria-label="Bosqichlar darajasi">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="question-box" aria-live="polite">
      <div class="question-number" id="questionNumber">1-savol / 5</div>
      <h2 id="question">Tayyor bo‘lsang, boshlaymiz!</h2>

      <form id="answerForm">
        <input id="answerInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Javobni yozing" aria-label="Javob" />
        <button id="submitButton" type="submit">Tekshirish</button>
      </form>

      <p id="feedback"></p>
    </section>

    <div class="actions">
      <button id="startButton">O‘yinni boshlash</button>
      <button id="restartButton" class="secondary">Yangilash</button>
    </div>
  </main>

  <script>
    const TOTAL_LEVELS = 100;
    const QUESTIONS_PER_LEVEL = 5;
    const STORAGE_KEY = 'matematika_sarguzashti_v1';

    let level = 1;
    let unlockedLevel = 1;
    let score = 0;
    let questionIndex = 0;
    let correctCount = 0;
    let currentAnswer = 0;
    let awaitingInput = false;

    const element = id => document.getElementById(id);

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.unlockedLevel === 'number') unlockedLevel = Math.min(TOTAL_LEVELS, Math.max(1, data.unlockedLevel));
        if (typeof data.score === 'number') score = Math.max(0, data.score);
        if (typeof data.level === 'number') level = Math.min(TOTAL_LEVELS, Math.max(1, data.level));
      } catch (err) {
        console.log('Progress not loaded');
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ unlockedLevel, score, level }));
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function gradeForLevel(levelNumber) {
      return Math.min(5, Math.ceil(levelNumber / 20));
    }

    function levelDifficulty(levelNumber) {
      return (levelNumber - 1) % 20;
    }

    function makeQuestion(levelNumber) {
      const grade = gradeForLevel(levelNumber);
      const d = levelDifficulty(levelNumber);
      let a, b, text, answer;

      if (grade === 1) {
        a = randomInt(1, 9 + d);
        b = randomInt(1, 9 + d);
        if (Math.random() < 0.5) {
          answer = a + b;
          text = `${a} + ${b} = ?`;
        } else {
          if (b > a) [a, b] = [b, a];
          answer = a - b;
          text = `${a} - ${b} = ?`;
        }
      }

      else if (grade === 2) {
        const kind = randomInt(0, 3);
        if (kind === 0) {
          a = randomInt(10, 50 + d * 2);
          b = randomInt(10, 50 + d * 2);
          answer = a + b;
          text = `${a} + ${b} = ?`;
        } else if (kind === 1) {
          a = randomInt(20, 90 + d * 2);
          b = randomInt(1, a - 1);
          answer = a - b;
          text = `${a} - ${b} = ?`;
        } else if (kind === 2) {
          a = randomInt(2, 9);
          b = randomInt(2, 9 + Math.floor(d / 5));
          answer = a * b;
          text = `${a} × ${b} = ?`;
        } else {
          b = randomInt(2, 9);
          answer = randomInt(2, 9 + Math.floor(d / 5));
          a = b * answer;
          text = `${a} ÷ ${b} = ?`;
        }
      }

      else if (grade === 3) {
        const kind = randomInt(0, 3);
        if (kind === 0) {
          a = randomInt(2, 12);
          b = randomInt(2, 12);
          answer = a * b;
          text = `${a} × ${b} = ?`;
        } else if (kind === 1) {
          b = randomInt(2, 12);
          answer = randomInt(2, 12);
          a = b * answer;
          text = `${a} ÷ ${b} = ?`;
        } else if (kind === 2) {
          const w = randomInt(3, 12 + d);
          const h = randomInt(3, 12 + d);
          answer = 2 * (w + h);
          text = `Eni ${w} sm, bo‘yi ${h} sm bo‘lgan to‘g‘ri to‘rtburchakning perimetri necha sm?`;
        } else {
          const denom = randomInt(2, 5);
          const part = randomInt(1, denom - 1);
          const total = denom * randomInt(2, 12);
          answer = total * part / denom;
          text = `${total} ning ${part}/${denom} qismi nechaga teng?`;
        }
      }

      else if (grade === 4) {
        const kind = randomInt(0, 3);
        if (kind === 0) {
          a = randomInt(15, 90);
          b = randomInt(2, 9);
          answer = a * b;
          text = `${a} × ${b} = ?`;
        } else if (kind === 1) {
          b = randomInt(2, 9);
          answer = randomInt(15, 90);
          a = b * answer;
          text = `${a} ÷ ${b} = ?`;
        } else if (kind === 2) {
          const w = randomInt(4, 20);
          const h = randomInt(4, 20);
          answer = w * h;
          text = `Eni ${w} sm, bo‘yi ${h} sm bo‘lgan to‘g‘ri to‘rtburchakning yuzi necha sm²?`;
        } else {
          a = Number((randomInt(1, 20) / 10).toFixed(1));
          b = Number((randomInt(1, 20) / 10).toFixed(1));
          answer = Number((a + b).toFixed(1));
          text = `${a.toFixed(1)} + ${b.toFixed(1)} = ?`;
        }
      }

      else {
        const kind = randomInt(0, 4);
        if (kind === 0) {
          const whole = randomInt(20, 200);
          const percent = [10, 20, 25, 50].random ? [10, 20, 25, 50][randomInt(0, 3)] : 10;
          answer = Math.round((whole * percent) / 100);
          text = `${whole} ning ${percent}% i nechaga teng?`;
        } else if (kind === 1) {
          a = Number((randomInt(5, 35) / 10).toFixed(1));
          b = Number((randomInt(5, 35) / 10).toFixed(1));
          answer = Number((a + b).toFixed(1));
          text = `${a.toFixed(1)} + ${b.toFixed(1)} = ?`;
        } else if (kind === 2) {
          const l = randomInt(2, 12);
          const w = randomInt(2, 12);
          const h = randomInt(2, 12);
          answer = l * w * h;
          text = `Bo‘yi ${l} sm, eni ${w} sm, balandligi ${h} sm bo‘lgan qutining hajmi necha sm³?`;
        } else if (kind === 3) {
          const numerator = randomInt(1, 5);
          const denominator = randomInt(2, 9);
          const multiple = randomInt(2, 12);
          answer = (numerator * multiple) / denominator;
          text = `${numerator}/${denominator} ning ${multiple} baravarini toping.`;
        } else {
          a = randomInt(12, 40);
          b = randomInt(2, 12);
          answer = a * b;
          text = `${a} × ${b} = ?`;
        }
      }

      return { text, answer };
    }

    function refreshStats() {
      const currentGrade = gradeForLevel(level);
      element('levelLabel').textContent = `Bosqich ${level} / ${TOTAL_LEVELS}`;
      element('gradeLabel').textContent = `${currentGrade}-sinf`;
      element('scoreLabel').textContent = `Ball: ${score}`;
      element('progressBar').style.width = `${(questionIndex / QUESTIONS_PER_LEVEL) * 100}%`;
    }

    function showQuestion() {
      refreshStats();
      const q = makeQuestion(level);
      currentAnswer = q.answer;
      element('questionNumber').textContent = `${questionIndex + 1}-savol / ${QUESTIONS_PER_LEVEL}`;
      element('question').textContent = q.text;
      element('feedback').textContent = '';
      element('feedback').className = '';
      const inputEl = element('answerInput');
      inputEl.value = '';
      inputEl.disabled = false;
      element('submitButton').disabled = false;
      awaitingInput = true;
      inputEl.focus();
    }

    function startLevel() {
      questionIndex = 0;
      correctCount = 0;
      const startBtn = element('startButton');
      startBtn.classList.add('hidden');
      showQuestion();
    }

    function setMessage(text, type) {
      const msg = element('feedback');
      msg.textContent = text;
      msg.className = type;
    }

    element('answerForm').addEventListener('submit', function (event) {
      event.preventDefault();
      if (!awaitingInput) return;

      const inputValue = element('answerInput').value.trim().replace(',', '.');
      if (inputValue === '' || Number.isNaN(Number(inputValue))) {
        setMessage('Iltimos, javobni son ko‘rinishida kiriting.', 'bad');
        return;
      }

      awaitingInput = false;
      const inputEl = element('answerInput');
      inputEl.disabled = true;
      element('submitButton').disabled = true;

      const entered = Number(inputValue);
      const isCorrect = Math.abs(entered - currentAnswer) < 0.001;

      if (isCorrect) {
        correctCount += 1;
        score += 10;
        setMessage('To‘g‘ri! Barakalla! 🎉', 'good');
      } else {
        setMessage(`Xato. To‘g‘ri javob: ${currentAnswer}`, 'bad');
      }

      saveProgress();
      refreshStats();
      questionIndex += 1;

      setTimeout(() => {
        if (questionIndex < QUESTIONS_PER_LEVEL) {
          showQuestion();
          return;
        }

        const startBtn = element('startButton');
        if (correctCount >= 3) {
          if (level >= TOTAL_LEVELS) {
            element('question').textContent = 'Tabriklaymiz! Siz 100 bosqichni yakunladingiz! 🏆';
            setMessage(`Ajoyib natija: ${correctCount}/${QUESTIONS_PER_LEVEL} ta to‘g‘ri!`, 'good');
            startBtn.textContent = 'Qayta boshlash';
            startBtn.classList.remove('hidden');
          } else {
            unlockedLevel = Math.max(unlockedLevel, level + 1);
            level += 1;
            saveProgress();
            element('question').textContent = 'Bosqich muvaffaqiyatli yakunlandi!';
            setMessage(`${correctCount}/${QUESTIONS_PER_LEVEL} ta to‘g‘ri — keyingi bosqich ochildi!`, 'good');
            startBtn.textContent = 'Keyingi bosqich';
            startBtn.classList.remove('hidden');
          }
        } else {
          element('question').textContent = 'Bu safar o‘xshamadi. Yana urinib ko‘ring!';
          setMessage(`${correctCount}/${QUESTIONS_PER_LEVEL} ta to‘g‘ri. Kamida 3 ta bo‘lishi kerak.`, 'bad');
          startBtn.textContent = 'Qayta urinish';
          startBtn.classList.remove('hidden');
        }

        element('submitButton').disabled = true;
        element('answerInput').disabled = true;
      }, 900);
    });

    element('startButton').addEventListener('click', function () {
      if (level > unlockedLevel) level = unlockedLevel;
      startLevel();
    });

    element('restartButton').addEventListener('click', function () {
      if (confirm('Barcha natijalar va ochilgan bosqichlarni qayta tiklaysizmi?')) {
        localStorage.removeItem(STORAGE_KEY);
        unlockedLevel = 1;
        level = 1;
        score = 0;
        questionIndex = 0;
        correctCount = 0;
        element('question').textContent = 'Tayyor bo‘lsang, boshlaymiz!';
        element('feedback').textContent = '';
        element('feedback').className = '';
        element('progressBar').style.width = '0%';
        refreshStats();
        element('startButton').textContent = 'O‘yinni boshlash';
        element('startButton').classList.remove('hidden');
        element('answerInput').disabled = true;
        element('submitButton').disabled = true;
      }
    });

    loadProgress();
    refreshStats();
    element('answerInput').disabled = true;
    element('submitButton').disabled = true;
    element('startButton').textContent = `Boshlash (${unlockedLevel}-bosqich)`;
  </script>
</body>
</html>
